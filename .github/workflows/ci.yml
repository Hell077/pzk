name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
      - run: go test ./...
      - run: go vet ./...
      - name: Install published Unix release
        if: runner.os != 'Windows'
        shell: bash
        env:
          PORTGUARD_INSTALL_DIR: ${{ runner.temp }}/portguard-release-install
        run: |
          sh scripts/install.sh
          "$PORTGUARD_INSTALL_DIR/portguard" --version
      - name: Install published Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PORTGUARD_INSTALL_DIR: ${{ runner.temp }}/portguard-release-install
        run: |
          ./scripts/install.ps1
          & "$env:PORTGUARD_INSTALL_DIR/portguard.exe" --version
      - name: Test SIMD build
        run: go test ./...
        env:
          GOEXPERIMENT: simd
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
      - run: go test -race ./...
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..HEAD"
          else
            range="HEAD^..HEAD"
          fi
          failed=0
          while IFS= read -r subject; do
            if ! [[ "$subject" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9._/-]+\))?!?:\ .+ ]]; then
              printf 'Invalid commit subject: %s\n' "$subject"
              failed=1
            fi
          done < <(git log --format=%s "$range")
          exit "$failed"
